# Déploiement Dokploy (type « Compose »).
#
# Deux services sur la même image et le même volume :
# - `rssresume`, le travailleur, sans port ni domaine : il dort jusqu'à
#   `RSSRESUME_SCHEDULE` puis envoie le digest de la veille à chaque profil ;
# - `api`, le serveur HTTP qu'appelle le site : il édite la base de profils que le
#   travailleur lit, et sert les audios qu'il a écrits. Aucun port publié.
services:
  rssresume:
    build: .
    restart: unless-stopped
    # Les variables saisies dans l'onglet « Environment » de Dokploy y sont écrites.
    # `required: false` pour qu'un `docker compose up` local sans fichier fonctionne.
    env_file:
      - path: .env
        required: false
    environment:
      # Imposé ici et non laissé à l'environnement : `environment` l'emporte sur
      # `env_file`, donc un `RSSRESUME_OUTPUT_DIR=output` hérité du poste de travail ne
      # peut pas faire écrire le conteneur dans /app, que l'utilisateur non-root ne
      # possède pas. La sortie va dans le volume, et nulle part ailleurs.
      RSSRESUME_OUTPUT_DIR: /data/output
      # Les profils, en base dans le volume : l'API les y écrit, le passage les y relit à
      # chaque fois, et la sortie de chacun va sous /data/output/{id}/. La base remplace
      # le dossier /data/profils (RSSRESUME_PROFILES_DIR) : les documents qui s'y
      # trouvent s'importent une fois, `python -m rssresume.api importer /data/profils`,
      # et restent sur le disque, intacts, comme sauvegarde. Exclusive de
      # RSSRESUME_PROFILES_DIR, RSSRESUME_PROFILE_FILE et RSSRESUME_PROFILE : les laisser
      # dans l'environnement fait échouer le lancement.
      RSSRESUME_PROFILES_DB: /data/profils.sqlite3
      # L'heure du passage et la journée digérée (J-1 par défaut : à 7 h du matin,
      # « aujourd'hui » ne contient que les articles parus depuis minuit).
      RSSRESUME_SCHEDULE: ${RSSRESUME_SCHEDULE:-04:00}
      RSSRESUME_SCHEDULE_DAYS_BACK: ${RSSRESUME_SCHEDULE_DAYS_BACK:-1}
      RSSRESUME_TIMEZONE: ${RSSRESUME_TIMEZONE:-Europe/Paris}
      # L'horloge du conteneur, pour que l'horodatage des logs se lise sans conversion.
      TZ: ${RSSRESUME_TIMEZONE:-Europe/Paris}
    volumes:
      # Audio et journaux du jour : l'email les emporte, le volume les garde.
      - rssresume-data:/data

  api:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "rssresume.api"]
    # Le même fichier que le travailleur : `RSSRESUME_API_TOKEN` s'y pose, dans l'onglet
    # « Environment ». Absent ou de moins de 32 caractères, le service refuse de démarrer.
    env_file:
      - path: .env
        required: false
    environment:
      # Les mêmes chemins que le travailleur, et imposés pour la même raison : l'API lit
      # ce qu'il écrit, à l'endroit où il l'écrit.
      RSSRESUME_OUTPUT_DIR: /data/output
      RSSRESUME_PROFILES_DB: /data/profils.sqlite3
      RSSRESUME_API_PORT: "8080"
      TZ: ${RSSRESUME_TIMEZONE:-Europe/Paris}
    # `expose` et non `ports` : jamais joignable depuis Internet. Le site, seul client, est
    # une application Dokploy distincte : il ne partage pas le réseau de ce compose, d'où le
    # rattachement à `dokploy-network`, le réseau que Dokploy donne à toutes ses
    # applications. L'alias, et non le nom de service : `api` est un nom que d'autres
    # projets de ce réseau peuvent porter aussi, et la résolution deviendrait une loterie.
    # Le site appelle donc `http://rssresume-api:8080`.
    expose:
      - "8080"
    networks:
      default:
      dokploy-network:
        aliases:
          - rssresume-api
    volumes:
      - rssresume-data:/data

# Créé par Dokploy à son installation. Pour un `docker compose up` local, le créer une fois :
# `docker network create dokploy-network`.
networks:
  dokploy-network:
    external: true

volumes:
  rssresume-data:
