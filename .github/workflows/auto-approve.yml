name: Auto-Approve & Merge PR

on:
  workflow_run:
    workflows: ["Claude Code Review"]
    types: [completed]

jobs:
  auto-approve-merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh
          gh --version

      - name: Configure GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get PR number
        id: pr-details
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extraire le numéro de PR depuis l'événement workflow_run
          PR_NUMBER=$(jq --raw-output '.workflow_run.pull_requests[0].number' "$GITHUB_EVENT_PATH")
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "PR Number: $PR_NUMBER"

      - name: Fetch all comments for the PR
        id: fetch-comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
        run: |
          # Récupérer tous les commentaires de la PR
          COMMENTS=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/comments)
          echo "comments=$COMMENTS" >> $GITHUB_OUTPUT
          echo "Comments fetched: $(echo "$COMMENTS" | jq length)"

      - name: Extract score from comments
        id: score
        env:
          COMMENTS: ${{ steps.fetch-comments.outputs.comments }}
        run: |
          # Chercher un commentaire contenant "Score: X/10"
          SCORE=$(echo "$COMMENTS" | jq -r '.[] | select(.body | test("Score:\\s*\\d+/10")) | .body' | head -1)
          if [ -z "$SCORE" ]; then
            echo "No score found in comments, defaulting to 10"
            SCORE_VALUE=10
          else
            SCORE_VALUE=$(echo "$SCORE" | grep -oP 'Score:\s*\(\K\d+' | head -1)
            if [ -z "$SCORE_VALUE" ]; then
              echo "Failed to parse score, defaulting to 10"
              SCORE_VALUE=10
            fi
          fi
          echo "score=$SCORE_VALUE" >> $GITHUB_OUTPUT
          echo "Extracted Score: $SCORE_VALUE/10"

      - name: Post score summary comment
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          SCORE: ${{ steps.score.outputs.score }}
        run: |
          gh pr comment "$PR_NUMBER" --body "
          🔍 **Score de complexité** : **$SCORE/10**
          - **1-4** : Simple/Trivial → Auto-approve + merge
          - **5-7** : Modéré → Review humaine recommandée
          - **8-10** : Complexe/Critique → Review humaine **requise**
          "

      - name: Auto-approve, merge, and delete branch (if score < 5)
        if: ${{ steps.score.outputs.score < 5 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
        run: |
          # Approuver la PR
          gh pr review --approve "$PR_NUMBER" -b "✅ **Auto-approved** : Score = ${{ steps.score.outputs.score }}/10 (Simple/Trivial)"
          sleep 5
          # Attendre que l'approbation soit enregistrée
          
          # Vérifier que la PR a au moins une approbation
          APPROVALS=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews | jq '[.[] | select(.state == "APPROVED")] | length')
          if [ "$APPROVALS" -ge 1 ]; then
            # Merger la PR en squashant et supprimant la branche
            gh pr merge "$PR_NUMBER" --squash --delete-branch -b "🤖 **Auto-merged** : Score = ${{ steps.score.outputs.score }}/10"
          else
            echo "No approvals found after auto-approve, skipping merge"
          fi