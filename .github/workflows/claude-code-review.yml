name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analyse cette pull request et fais une review complète du code.
            À la fin de ta review, **ajoute un commentaire avec le score suivant** (format strict) :
            ---
            Score: [X]/10
            Justification: [1 phrase expliquant le score]
            ---
            Où X est un entier entre 1 et 10 basé sur :
            - 1-4 : Changement trivial (ex: typo, reformattage, docs)
            - 5-7 : Changement modéré (nouvelle fonctionnalité simple, refactor mineur)
            - 8-10 : Changement complexe ou critique (refactor majeur, sécurité, composants critiques)
            Exemple : "Score: 2/10\nJustification: Correction d'une faute de frappe dans un commentaire."
          claude_args: '--allowed-tools mcp__github_inline_comment__create_inline_comment'