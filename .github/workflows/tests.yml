# La suite sur chaque PR et sur main : une branche de /backlog-pop ne se fusionne que verte.
# Mêmes versions que les images Docker, pour qu'un vert ici soit un vert en production.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Bibliothèque standard seule ; tzdata est fournie par le système sous Linux.
      - run: python -m unittest discover -s tests -p "test*.py"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
